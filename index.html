<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to news…</title>
  <!-- Instant HTML meta refresh redirect -->
  <meta http-equiv="refresh" content="0; url=https://news-sh.github.io/ai" />
  <link rel="canonical" href="https://news-sh.github.io/ai" />
  <style>
    :root {
      --bg: #05060a;
      --text: #e8eaef;
      --accent: #7c9cff;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #8b90a0; margin-bottom: 24px; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #05060a;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
  <script>
    // Instant JavaScript redirect without keeping the redirect page in browser history
    window.location.replace("https://news-sh.github.io/ai");
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting…</h1>
    <p>Taking you to the news app by chrisben and jovial.</p>
    <a href="https://news-sh.github.io/ai">Click here if not redirected</a>
  </div>
</body>
</html>
